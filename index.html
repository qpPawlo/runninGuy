<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0d0f1c">
  <title>Math Gate Runner</title>
  <!-- Telegram Mini App SDK: без нього гра працює як звичайна веб-сторінка. -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    html, body { margin: 0; padding: 0; width: 100%; height: 100%; background: #0d0f1c; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-container { position: fixed; inset: 0; width: 100%; height: 100%; }
    #unity-canvas { width: 100%; height: 100%; display: block; background: #0d0f1c; }
    #loader { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #fff; font-family: -apple-system, Segoe UI, Roboto, sans-serif; background: #0d0f1c; }
    #loader h1 { font-size: 28px; margin: 0 0 24px; letter-spacing: 2px; }
    #bar { width: 60%; max-width: 320px; height: 10px; background: rgba(255,255,255,0.15); border-radius: 5px; overflow: hidden; }
    #fill { width: 0; height: 100%; background: #ffd033; border-radius: 5px; transition: width 0.15s; }
    #hint { margin-top: 16px; font-size: 14px; opacity: 0.6; }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
  </div>
  <div id="loader">
    <h1>MATH GATE RUNNER</h1>
    <div id="bar"><div id="fill"></div></div>
    <div id="hint">Loading…</div>
  </div>
  <script>
    var canvas = document.querySelector("#unity-canvas");
    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/96385e0f3cccc83761c469af5626c1a7.loader.js";
    var config = {
      arguments: [],
      dataUrl: buildUrl + "/142bbbf1ae3e96149fe089e526b9747b.data.unityweb",
      frameworkUrl: buildUrl + "/7883fddcf42500d2e4d5d37e9299d948.framework.js.unityweb",
      codeUrl: buildUrl + "/3edeaac20395987f823a16f3360f8bb5.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Math Gate Runner",
      productVersion: "1.0",
      // Рендер у фізичній роздільності телефону занадто дорогий для WebGL — 1 CSS-піксель = 1 піксель кадру.
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.5)
    };

    // Telegram: розгорнути на весь екран ще до завантаження Unity.
    try {
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
      }
    } catch (e) {}

    // Discord Activity: гра відкрита всередині Discord (домен <id>.discordsays.com) — робимо рукостискання з клієнтом.
    var DISCORD_CLIENT_ID = "1572523791018623037";
    var isDiscord = /\.discordsays\.com$/.test(location.hostname) || new URLSearchParams(location.search).has("frame_id");
    if (isDiscord) {
      var ds = document.createElement("script");
      ds.src = "discord-sdk.js";
      ds.onload = function () {
        try {
          var sdk = new DiscordSDKBundle.DiscordSDK(DISCORD_CLIENT_ID);
          window.discordSdk = sdk;
          sdk.ready().then(function () {
            // Вхід через Discord лише заради ніка в таблиці лідерів (scope identify).
            // Код обмінюємо на ім'я в нашому воркері (URL Mapping "/api"), секрет застосунку живе тільки там.
            return sdk.commands.authorize({ client_id: DISCORD_CLIENT_ID, response_type: "code", state: "", prompt: "none", scope: ["identify"] });
          }).then(function (res) {
            return fetch("/.proxy/api/discord/token", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({ code: res.code })
            });
          }).then(function (r) {
            if (!r.ok) throw new Error("token " + r.status);
            return r.json();
          }).then(function (u) {
            if (u && u.id) window.discordUser = { id: String(u.id), name: u.global_name || u.username || "" };
          }).catch(function (e) { console.warn("Discord login skipped", e); });
        } catch (e) { console.warn("Discord SDK init failed", e); }
      };
      document.head.appendChild(ds);
    }

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        document.querySelector("#fill").style.width = Math.round(progress * 100) + "%";
      }).then(function (unityInstance) {
        window.unityInstance = unityInstance; // потрібен для Telegram.jslib (SendMessage назад у Unity)
        document.querySelector("#loader").style.display = "none";
      }).catch(function (message) {
        document.querySelector("#hint").textContent = message;
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
